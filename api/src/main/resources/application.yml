server:
  port: 8080

spring:
  application:
    name: price-monitor-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/pricemonitor}
    username: ${DB_USER:pricemonitor}
    password: ${DB_PASSWORD:pricemonitor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  mvc:
    problemdetails:
      enabled: true

pricemonitor:
  api:
    matcher-accept-threshold: 0.55
    matcher-review-margin: 0.10
    sse-timeout: 2m
    import-interval: 6h
    seller-api-timeout: 3s
    admin-email: admin@pricemonitor.local
    mail-from: powiadomienia@pricemonitor.local

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
